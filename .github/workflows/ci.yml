name: MD20 CI (Windows / macOS / Linux, CPU)

on:
  push:
    branches: [main]
    # documentation-only pushes (decision log, specs) must not start — or cancel — the long real-engine runs
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # PRs: a new push cancels the previous run.  main: never cancel — the Ubuntu MD20_HEAVY job needs ~60–70 min and
  # pushes come faster than that, so with cancellation the heavy tests almost never finished (and a killed pytest
  # prints no FAILURES section, so the posted log had no traceback either).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write   # failure logs are posted as commit comments (readable through the REST API)

jobs:
  pure-python:
    # Fast gate: no chemistry stack; runs the 27 pure-Python tests on all three OSes.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - shell: bash
        run: pytest -q --ignore=tests/test_openmm_integration.py --ignore=tests/test_real_case_integration.py --ignore=tests/test_docking_integration.py --ignore=tests/test_workflow_integration.py --ignore=tests/test_binding_integration.py --ignore=tests/test_screen_integration.py 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
      - run: python -m md20.cli demo --dir ${{ runner.temp }}/md20demo
      - run: python -m md20.cli doctor --no-benchmark || true   # degraded mode (no openmm): must not crash
      - name: Post failure log as commit comment
        if: failure() || cancelled()
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          body="### CI failure: pure-python (${{ matrix.os }}, py${{ matrix.python }})"$'\n```\n'"$(tail -c 60000 pytest.log 2>/dev/null || echo 'no pytest.log')"$'\n```'
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$body" >/dev/null || true

  openmm-stack:
    # Full stack via micromamba (same environment files the installer uses); real OpenMM on the CPU platform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            gpu_yml: environment/windows-opencl.yml
            override_cuda: "12.4"
          - os: macos-latest
            gpu_yml: environment/macos.yml
            override_cuda: ""
          - os: ubuntu-latest
            gpu_yml: environment/linux-cuda.yml
            override_cuda: "12.4"
            heavy: "1"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash
          cache-downloads: true
      - name: Create environment (solver output kept)
        shell: bash -el {0}
        env:
          CONDA_OVERRIDE_CUDA: ${{ matrix.override_cuda }}
        run: |
          set -o pipefail
          "$MAMBA_EXE" create -y -n md20 -f environment/base.yml -f ${{ matrix.gpu_yml }} 2>&1 | tee env.log
          echo "micromamba create exit=$?" | tee -a env.log
      - name: Install md20 (+ pip-only deps)
        shell: bash -el {0}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -o pipefail
          "$MAMBA_EXE" run -n md20 python -m pip install --no-cache-dir "openmmforcefields>=0.14" "meeko>=0.5" -e . 2>&1 | tee -a env.log
          "$MAMBA_EXE" run -n md20 md20 setup-vina 2>&1 | tee -a env.log
      - name: Doctor (CPU platform)
        shell: bash -el {0}
        run: '"$MAMBA_EXE" run -n md20 md20 doctor --seconds 5 || true'
      - name: Full test suite incl. real OpenMM
        shell: bash -el {0}
        # normal: mac ~16 min, windows ~23, ubuntu heavy ~62 (3PTB full workflow ~32, pose screen ~16); a step
        # timeout (unlike the job timeout) still lets the failure-log step post pytest.log
        timeout-minutes: 120
        env: { MD20_HEAVY: "${{ matrix.heavy }}" }
        run: |
          set -o pipefail
          "$MAMBA_EXE" run -n md20 pytest -vv -rs --durations=15 2>&1 | tee pytest.log
      - name: Post failure log as commit comment
        if: failure() || cancelled()
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          body="### CI failure: openmm-stack (${{ matrix.os }})"$'\n```\n'"$(tail -c 30000 env.log 2>/dev/null)"$'\n----- pytest -----\n'"$(tail -c 30000 pytest.log 2>/dev/null || echo 'no pytest.log')"$'\n```'
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$body" >/dev/null || true
      - name: Post test summary (always)
        if: always()
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          sum=$(grep -E "PASSED|FAILED|SKIPPED|ERROR|passed|failed" pytest.log 2>/dev/null | sed 's/ \[ *[0-9]*%\]//' | tail -c 20000)
          nskip=$(grep -cE "SKIPPED" pytest.log 2>/dev/null || true)
          skips=$(sed -n '/short test summary/,$p' pytest.log 2>/dev/null | grep -E "^SKIPPED" | head -c 4000)
          doc=$("$MAMBA_EXE" run -n md20 md20 doctor --no-benchmark 2>/dev/null | head -c 6000 || true)
          body="### CI summary: openmm-stack (${{ matrix.os }}) — ${{ job.status }} — ${nskip} skipped"$'\n```\n'"$sum"$'\n```\n<details><summary>skip reasons（跳過的整合測試不算通過）</summary>\n\n```\n'"$skips"$'\n```\n</details>\n<details><summary>doctor</summary>\n\n'"$doc"$'\n</details>'
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$body" >/dev/null || true
      - name: Post paper-validation results (always)
        if: always()
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [ -d validation_results ] || exit 0
          body="### Paper validation (${{ matrix.os }})"$'\n'
          for f in validation_results/*.json; do body+=$'\n<details><summary>'"$(basename $f)"$'</summary>\n\n```json\n'"$(head -c 12000 $f)"$'\n```\n</details>'; done
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$body" >/dev/null || true
      - name: Upload doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-${{ matrix.os }}
          path: |
            ~/AppData/Local/MD20/doctor/*
            ~/Library/Application Support/MD20/doctor/*
            ~/.local/share/MD20/doctor/*
          if-no-files-found: ignore
      - name: Export explicit lock file (exact package URLs of the environment that passed)
        if: always()
        shell: bash
        run: '"$MAMBA_EXE" env export -n md20 --explicit > md20-lock-${{ runner.os }}.txt 2>/dev/null || true; "$MAMBA_EXE" run -n md20 pip freeze > md20-pip-${{ runner.os }}.txt 2>/dev/null || true'
      - name: Upload lock files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lock-${{ runner.os }}
          path: md20-*-${{ runner.os }}.txt
          if-no-files-found: ignore

  paper-docking:
    # Hsieh 2024/2025 docking reproductions: hours of Vina on 4 cores, so they live here — non-blocking, never
    # holding the openmm-stack gate.  Results are posted as a commit comment like the other validation JSON.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash
          cache-downloads: true
      - name: Create environment
        shell: bash -el {0}
        env: { CONDA_OVERRIDE_CUDA: "12.4" }
        run: '"$MAMBA_EXE" create -y -n md20 -f environment/base.yml -f environment/linux-cuda.yml'
      - name: Install md20
        shell: bash -el {0}
        run: |
          "$MAMBA_EXE" run -n md20 python -m pip install --no-cache-dir "openmmforcefields>=0.14" "meeko>=0.5" -e .
          "$MAMBA_EXE" run -n md20 md20 setup-vina
      - name: Paper docking reproductions
        shell: bash -el {0}
        timeout-minutes: 180
        env: { MD20_PAPERS: "1" }
        run: |
          set -o pipefail
          "$MAMBA_EXE" run -n md20 pytest -vv -s --durations=5 tests/test_validation_papers.py -k reproduce 2>&1 | tee pytest.log
      - name: Post results (always)
        if: always()
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          body="### Paper docking (ubuntu, exhaustiveness 8) — ${{ job.status }}"$'\n```\n'"$(grep -E 'PASSED|FAILED|SKIPPED|ERROR|passed|failed|slowest|^[0-9.]+s call' pytest.log 2>/dev/null | tail -c 6000)"$'\n```\n'
          for f in validation_results/*_docking.json; do [ -f "$f" ] && body+=$'\n<details><summary>'"$(basename $f)"$'</summary>\n\n```json\n'"$(head -c 12000 $f)"$'\n```\n</details>'; done
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$body" >/dev/null || true

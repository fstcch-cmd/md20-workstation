name: Release (Windows and macOS installers)

# A release is published only after the exact ZIP students will download has been unzipped and installed on a clean
# Windows runner with Windows PowerShell 5.1, and the installed program still works after the unzipped folder is
# deleted (D-33).  Trigger: push a tag v*  (or run manually with a tag name).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "release tag, e.g. v0.1.0a1", required: true }

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${{ github.event.inputs.tag }}"; [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: "Build ZIP (git archive applies .gitattributes, *.cmd keep CRLF)"
        run: |
          tag="${{ steps.v.outputs.tag }}"
          git archive --format=zip --prefix="MD20-$tag/" -o "MD20-Windows-$tag.zip" HEAD
          cp "MD20-Windows-$tag.zip" "MD20-macOS-$tag.zip"     # same files; both installers are inside (D-66)
          sha256sum "MD20-Windows-$tag.zip" "MD20-macOS-$tag.zip" > SHA256SUMS.txt
          unzip -l "MD20-Windows-$tag.zip" | grep -E "Install-MD20.cmd|installer/install.ps1|environment/base.yml"
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: { name: md20-windows-zip, path: "MD20-*.zip\nSHA256SUMS.txt" }

  verify-windows:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/download-artifact@v4
        with: { name: md20-windows-zip, path: dl }
      - name: Install-MD20.cmd run from inside the ZIP explains how to extract (D-91)
        shell: cmd
        env:
          MD20_NOPAUSE: "1"
        run: |
          mkdir "%RUNNER_TEMP%\only_cmd"
          powershell -NoProfile -Command "Add-Type -A System.IO.Compression.FileSystem; $z=[IO.Compression.ZipFile]::OpenRead((Get-ChildItem dl\MD20-Windows-*.zip).FullName); $e=$z.Entries | ? { $_.FullName -like '*/Install-MD20.cmd' }; [IO.Compression.ZipFileExtensions]::ExtractToFile($e, '%RUNNER_TEMP%\only_cmd\Install-MD20.cmd'); $z.Dispose()" || exit /b 1
          call "%RUNNER_TEMP%\only_cmd\Install-MD20.cmd" > "%RUNNER_TEMP%\only_cmd\out.txt"
          set RC=%ERRORLEVEL%
          type "%RUNNER_TEMP%\only_cmd\out.txt"
          if not "%RC%"=="3" (echo expected exit code 3, got %RC% & exit /b 1)
          findstr /c:"Extract All" "%RUNNER_TEMP%\only_cmd\out.txt" >nul || (echo the extract instruction is missing & exit /b 1)
      - name: Unzip and run Install-MD20.cmd (double-click entry point; Windows PowerShell 5.1 inside)
        shell: cmd
        env:
          MD20_NOPAUSE: "1"
        run: |
          set MD20_ROOT=%RUNNER_TEMP%\MD20
          powershell -NoProfile -Command "Expand-Archive -Path (Get-ChildItem dl\MD20-Windows-*.zip).FullName -DestinationPath '%RUNNER_TEMP%\unz' -Force" || exit /b 1
          for /d %%D in ("%RUNNER_TEMP%\unz\MD20-*") do set SRC=%%D
          call "%SRC%\Install-MD20.cmd" -Gpu cpu || exit /b 1
          if not exist "%MD20_ROOT%\app\pyproject.toml" (echo program was not copied to %MD20_ROOT%\app & exit /b 1)
          rmdir /s /q "%RUNNER_TEMP%\unz"
      - name: CUDA environment solves (dry run; the runner has no NVIDIA GPU, so the installer above took the CPU path)
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"   # native stderr must not throw (Actions prepends Stop)
          $mm = "$env:RUNNER_TEMP\MD20\micromamba.exe"; $env:MAMBA_ROOT_PREFIX = "$env:RUNNER_TEMP\MD20"; $env:CONDA_OVERRIDE_CUDA = "12.7"
          foreach ($cv in "12.4", "11.8") {
            $y = "$env:RUNNER_TEMP\cuda-$cv.yml"
            (Get-Content $env:RUNNER_TEMP\MD20\app\environment\windows-cuda.yml) -replace "cuda-version=[0-9.]+", "cuda-version=$cv" | Set-Content $y
            & $mm create --dry-run -y -p "$env:RUNNER_TEMP\cudatest" -f $env:RUNNER_TEMP\MD20\app\environment\base.yml -f $y
            if ($LASTEXITCODE -ne 0) { Write-Host "CUDA $cv environment does not solve (D-36)"; exit 1 }
          }
      - name: Installed program works without the unzipped folder
        shell: cmd
        run: |
          set MD20=%RUNNER_TEMP%\MD20
          call "%MD20%\md20.cmd" doctor --no-benchmark || exit /b 1
          call "%MD20%\md20.cmd" demo --dir "%RUNNER_TEMP%\md20demo" || exit /b 1
          call "%MD20%\md20.cmd" pipeline example > "%RUNNER_TEMP%\example.json" || exit /b 1
          dir "%MD20%\MD20-GUI.cmd" || exit /b 1
      - name: Desktop launcher opens the GUI (D-76)
        shell: pwsh
        run: |
          $d = [Environment]::GetFolderPath("Desktop"); $l = Join-Path $d "MD20-GUI.cmd"
          if (-not (Test-Path $l)) { Write-Host "no Desktop folder on this runner: skipped"; exit 0 }
          Get-Content $l
          # D-77: a student's PATH can be long (conda, MGLTools …); `micromamba run` then hit cmd's 8191-character limit
          $env:PATH = $env:PATH + (";C:\Program Files\Some Long Vendor Folder\With A Long Name\bin" * 120)
          Write-Host "PATH length for this check: $($env:PATH.Length)"
          $p = Start-Process cmd.exe -ArgumentList "/c `"$l`"" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            try { $r = Invoke-WebRequest http://127.0.0.1:8020/ -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep 2
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "double-clicking the desktop MD20-GUI.cmd did not start the GUI" }
          Write-Host "desktop launcher: GUI answered HTTP 200"

  verify-macos:
    needs: package
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/download-artifact@v4
        with: { name: md20-windows-zip, path: dl }
      - name: Unzip like Finder and run Install-MD20.command
        run: |
          ditto -x -k dl/MD20-macOS-*.zip "${RUNNER_TEMP}/unz"
          SRC=$(ls -d "${RUNNER_TEMP}"/unz/MD20-*)
          test -x "$SRC/Install-MD20.command"
          MD20_ROOT="${RUNNER_TEMP}/MD20" bash "$SRC/Install-MD20.command"
          rm -r "${RUNNER_TEMP}/unz"
      - name: Installed program works without the unzipped folder
        run: |
          M="${RUNNER_TEMP}/MD20/md20"
          "$M" doctor --no-benchmark
          "$M" demo --dir "${RUNNER_TEMP}/md20demo"
          "$M" pipeline example > "${RUNNER_TEMP}/example.json"
          test -x "${RUNNER_TEMP}/MD20/MD20-GUI.command"

  publish:
    needs: [package, verify-windows, verify-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: md20-windows-zip, path: dl }
      - name: Create GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="${{ needs.package.outputs.tag }}"
          notes="docs/releases/$tag.md"; [ -f "$notes" ] || notes="docs/WINDOWS_QUICKSTART.md"
          gh release create "$tag" dl/MD20-Windows-*.zip dl/MD20-macOS-*.zip dl/SHA256SUMS.txt --target "${{ github.sha }}" \
            --title "MD20 $tag（Windows／macOS 安裝程式）" --notes-file "$notes" --prerelease

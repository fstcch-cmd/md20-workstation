name: Diagnose membrane NaN (manual, DIAGNOSTIC - not qualification)

# DIAGNOSTIC, NOT QUALIFICATION (D-136): tools/diag_membrane_nan.py returns 0 on purpose, so a green diagnostic step
# proves nothing scientific.  The separate "Validate diagnostic artifact" steps decide only whether the artifact is
# COMPLETE (they fail on a missing/partial artifact or a build error); NaN counts are reported in the job summary, not
# judged.  Nothing from this workflow may be cited as a qualified membrane capability (docs/specs/capabilities.md).
# Manual only: reproduces and characterises the intermittent NaN in
# tests/test_membrane_integration.py::test_peptide_above_popc_case_b (docs/DECISIONS.md, 11/07).
# Round 2 (cross-OS): each OS builds and runs; then each OS re-runs the dynamics on the OTHER OS's builds, which
# separates "the structure built on Windows is bad" from "the dynamics on Windows is bad".
on:
  workflow_dispatch:
    inputs:
      builds: { description: "independent builds per job", default: "4" }
      seeds: { description: "velocity seeds per build", default: "1,2,3" }
      steps: { description: "MD steps per run", default: "200" }

permissions:
  contents: read

jobs:
  build:
    name: "diagnostic build+run (${{ matrix.tag }}) - not qualification"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, gpu_yml: environment/windows-opencl.yml, tag: win }
          - { os: ubuntu-latest, gpu_yml: environment/linux-cuda.yml, tag: linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with: { init-shell: bash, cache-downloads: true }
      - name: Create environment
        shell: bash -el {0}
        env: { CONDA_OVERRIDE_CUDA: "12.4" }
        run: '"$MAMBA_EXE" create -y -n md20 -f environment/base.yml -f ${{ matrix.gpu_yml }} > env.log 2>&1 || (tail -50 env.log; exit 1)'
      - name: Install md20
        shell: bash -el {0}
        run: '"$MAMBA_EXE" run -n md20 python -m pip install --no-cache-dir "openmmforcefields==0.15.1" "meeko~=0.5" gemmi -e .'
      - name: Build here and run here
        shell: bash -el {0}
        timeout-minutes: 130
        run: '"$MAMBA_EXE" run -n md20 python tools/diag_membrane_nan.py diag_out --builds ${{ inputs.builds }} --seeds ${{ inputs.seeds }} --steps ${{ inputs.steps }}'
      - name: Validate diagnostic artifact (blocks on incompleteness only; NaN counts are reported, not judged)
        if: always()
        shell: bash -el {0}
        run: '"$MAMBA_EXE" run -n md20 python tools/validate_membrane_diag.py diag_out --expect-builds ${{ inputs.builds }} --expect-seeds ${{ inputs.seeds }} --expect-steps ${{ inputs.steps }} --json diag_out/validation.json --markdown "$GITHUB_STEP_SUMMARY"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "builds-${{ matrix.tag }}"
          path: |
            diag_out/diag.json
            diag_out/validation.json
            diag_out/build*/system.xml
            diag_out/build*/topology.pdb
            diag_out/build*/build_manifest.json
          if-no-files-found: ignore

  cross:
    name: "diagnostic cross-run (${{ matrix.tag }}) - not qualification"
    needs: build
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, gpu_yml: environment/linux-cuda.yml, from: win, tag: linux-runs-win-builds }
          - { os: windows-latest, gpu_yml: environment/windows-opencl.yml, from: linux, tag: win-runs-linux-builds }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: "builds-${{ matrix.from }}", path: other }
      - uses: mamba-org/setup-micromamba@v2
        with: { init-shell: bash, cache-downloads: true }
      - name: Create environment
        shell: bash -el {0}
        env: { CONDA_OVERRIDE_CUDA: "12.4" }
        run: '"$MAMBA_EXE" create -y -n md20 -f environment/base.yml -f ${{ matrix.gpu_yml }} > env.log 2>&1 || (tail -50 env.log; exit 1)'
      - name: Install md20
        shell: bash -el {0}
        run: '"$MAMBA_EXE" run -n md20 python -m pip install --no-cache-dir "openmmforcefields==0.15.1" "meeko~=0.5" gemmi -e .'
      - name: Run here on the other OS's builds
        shell: bash -el {0}
        timeout-minutes: 130
        run: '"$MAMBA_EXE" run -n md20 python tools/diag_membrane_nan.py cross_out --from-builds other --seeds ${{ inputs.seeds }} --steps ${{ inputs.steps }}'
      - name: Validate diagnostic artifact (blocks on incompleteness only; NaN counts are reported, not judged)
        if: always()
        shell: bash -el {0}
        run: '"$MAMBA_EXE" run -n md20 python tools/validate_membrane_diag.py cross_out --expect-builds ${{ inputs.builds }} --expect-seeds ${{ inputs.seeds }} --expect-steps ${{ inputs.steps }} --json cross_out/validation.json --markdown "$GITHUB_STEP_SUMMARY"'

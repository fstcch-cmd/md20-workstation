name: GUI preview (screenshots for design review)

# Renders every GUI page to PNG so the interface can be reviewed without installing MD20 (D-42).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["md20/gui/**", "tools/gui_preview.py", ".github/workflows/gui-preview.yml"]

permissions:
  contents: write   # screenshots are also pushed to the `gui-preview` branch (artifact blobs are not reachable from the dev container)

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install GUI stack (no chemistry engines needed for page rendering)
        run: |
          pip install -e . nicegui playwright pytest
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk >/dev/null
      - name: Render pages
        run: python tools/gui_preview.py gui_preview
      - uses: actions/upload-artifact@v4
        with: { name: gui-preview, path: gui_preview/*.png }
      - name: Push screenshots to the gui-preview branch
        run: |
          mkdir /tmp/pv && cp gui_preview/*.png /tmp/pv/
          cd /tmp/pv && git init -q && git checkout -q -b gui-preview
          git -c user.name=ci -c user.email=ci@md20 add . && git -c user.name=ci -c user.email=ci@md20 commit -qm "GUI preview ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gui-preview

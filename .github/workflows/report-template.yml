name: Report template (every figure kind, synthetic data)

# D-59: renders tools/report_template.py with RDKit installed, so the compound-property, chemical-space and 2D
# interaction figures are included; the HTML (en + zh) is pushed to the `report-template` branch for review.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["md20/report/**", "md20/analysis/**", "tools/report_template.py", ".github/workflows/report-template.yml"]

permissions:
  contents: write

jobs:
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install (RDKit wheel; no MD engine needed)
        run: pip install -e . rdkit pytest
      - name: Render template and check every figure kind is present
        run: |
          python tools/report_template.py report_template
          python -m pytest -q tests/test_report_template.py
      - uses: actions/upload-artifact@v4
        with: { name: report-template, path: report_template/*.html }
      - name: Push to the report-template branch
        run: |
          mkdir /tmp/rt && cp report_template/*.html /tmp/rt/
          cd /tmp/rt && git init -q && git checkout -q -b report-template
          git -c user.name=ci -c user.email=ci@md20 add . && git -c user.name=ci -c user.email=ci@md20 commit -qm "Report template ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" report-template

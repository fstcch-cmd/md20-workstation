# MD20 base environment (all platforms).  D-163: packages with CI-recorded versions are pinned exactly (==); the rest await a CI-produced lock (docs/_pending/D-163.md, tests/test_env_lock.py PENDING_UNPINNED).
name: md20
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy==2.4.6      # D-163: exact (CI openmm-stack 5a3fa37 / d879f2b evidence, DECISIONS "NaN" observation)
  - pandas>=2
  - openpyxl          # Excel compound libraries (HTS screen)
  - scipy
  - cryptography
  - psutil
  - matplotlib-base   # not 'matplotlib': that pulls Qt6 (~150 MB) which MD20 never uses
  - plotly
  - rdkit>=2024.03
  - pdbfixer
  - mdtraj
  - parmed
  - pymbar>=4
  - openff-toolkit==0.18.0   # D-163: exact (same CI evidence)
  - openff-nagl
  - openff-nagl-models
  - lxml               # needed by openmmforcefields (pip install does not pull it)
  - pdb2pqr
  - gemmi              # meeko ≥ 0.6 imports it; the pip wheel did not pull it on Windows (CI: docking tests silently skipped)
  - propka
  - nicegui
  - pytest
  - pip
# vina: conda on Linux/macOS (see <os>.yml), pip wheel on Windows; meeko (pure Python) via pip everywhere.
# openmmforcefields is installed by the installer with pip (its conda package needs ambertools, absent on win-64).

# macOS (Apple Silicon or Intel).  OpenCL platform via Apple driver; CPU fallback.
name: md20
channels: [conda-forge]
dependencies:
  - openmm>=8.5,<8.7   # D-171: range (macOS has no CUDA constraint; newest in range = 8.6.1). CI pins exact via a lock file.
  - ambertools   # enables GAFF2/AM1-BCC ladder rung on macOS
  - vina>=1.2.5
